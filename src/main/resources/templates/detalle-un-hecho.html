<html th:replace="~{base ::html}">
<div th:fragment="contenido" class="row">

        <!-- HEADER -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 mb-0">
                <i class="fas fa-file-alt me-2"></i>
                <span th:text="${titulo}">Detalle del Hecho</span>
            </h1>

            <div>
                <a th:href="@{/hechos}"
                   class="btn btn-secondary">
                    <i class="fas fa-arrow-left me-1"></i>
                    Volver
                </a>
                <a th:href="@{/solicitudes/solicitud-eliminacion/hecho/{id}(id=${hecho.id})}"
                   class="btn btn-danger">
                    <i class="fas me-1"></i>
                    Eliminar
                </a>
            </div>
        </div>

        <!-- INFO -->
        <div class="card mb-4">
            <div class="card-header">
                <h5 class="card-title mb-0">
                    <i class="fas fa-id-card me-2"></i>
                    Información básica
                </h5>
            </div>

            <div class="card-body">

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Título</label>
                        <p class="form-control-plaintext" th:text="${hecho.titulo}">Título</p>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Descripción</label>
                        <p class="form-control-plaintext" th:text="${hecho.descripcion}">Descripción</p>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Categoría</label>
                        <p class="form-control-plaintext"
                           th:text="${hecho.categoriaDTO != null and hecho.categoriaDTO.nombre != null ? hecho.categoriaDTO.nombre : 'Sin categoría'}">
                            Sin categoría
                        </p>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Origen</label>
                        <p class="form-control-plaintext"
                           th:text="${hecho.origen != null ? hecho.origen : 'N/D'}">
                            N/D
                        </p>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Fecha del acontecimiento</label>
                        <p class="form-control-plaintext" th:text="${hecho.fechaAcontecimiento}">
                            2025-12-12
                        </p>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Latitud</label>
                        <p class="form-control-plaintext"
                           th:text="${hecho.ubicacionDTO != null ? hecho.ubicacionDTO.latitud : 'N/D'}">
                            N/D
                        </p>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Longitud</label>
                        <p class="form-control-plaintext"
                           th:text="${hecho.ubicacionDTO != null ? hecho.ubicacionDTO.longitud : 'N/D'}">
                            N/D
                        </p>
                    </div>
                </div>

            </div>
        </div>

    </div>
</div>
</html>
