<html th:replace="~{base :: layout(${titulo}, ~{::contenido}, ~{}, ~{})}">
<div th:fragment="contenido" class="row">

  <!-- HEADER -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0">
      <i class="fas fa-trash-alt me-2 text-danger"></i>
      <span th:text="${titulo}">Solicitud eliminación</span>
    </h1>

    <div>
      <a th:href="@{/}" class="btn btn-secondary">
        <i class="fas fa-arrow-left me-1"></i>
        Volver
      </a>
    </div>
  </div>

  <!-- FORM -->
  <div class="card mb-4 border-danger">
    <div class="card-header bg-danger text-white">
      <h5 class="card-title mb-0">
        <i class="fas fa-paper-plane me-2"></i>
        Motivo de la eliminación
      </h5>
    </div>

    <div class="card-body">
      <div class="alert alert-warning">
        <i class="fas fa-exclamation-triangle me-1"></i>
        La eliminación no es inmediata: queda pendiente de moderación.
      </div>

      <form th:action="@{/solicitudes/crear/solicitud-eliminacion/hecho/{idHecho}(idHecho=${idHecho})}"
            method="post">

        <div class="mb-3">
          <label class="form-label fw-bold">Motivo</label>

          <div class="alert alert-danger"
               th:if="${errorMotivo}"
               th:text="${errorMotivo}">
          </div>

          <textarea name="motivo"
                    class="form-control"
                    rows="6"
                    placeholder="Explicá el motivo de la eliminación..."
                    th:text="${motivo}"></textarea>

        </div>

        <div class="d-flex justify-content-end gap-2">
          <a th:href="@{/}" class="btn btn-outline-secondary">
            Cancelar
          </a>

          <button type="submit" class="btn btn-danger">
            <i class="fas fa-trash-alt me-1"></i>
            Enviar solicitud
          </button>
        </div>

      </form>
    </div>
  </div>

</div>
</html>
