<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro - MetaMapa</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <i class="bi bi-map-fill"></i> MetaMapa
        </a>
    </div>
</nav>

<main class="page-content container my-5">

    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">

            <h2 class="fw-bold mb-4 text-center">Crear Cuenta</h2>

            <div class="card shadow-sm">
                <div class="card-body">

                    <form th:action="@{/registro}" id="registroForm" method="post">

                        <div class="mb-3">
                            <label class="form-label">Nombre</label>
                            <input type="text" name="nombre" id="nombre" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" id="email" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Fecha nacimiento</label>
                            <input type="date" name="fechaNacimiento" id="fechaNacimiento" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Usuario</label>
                            <input type="text" name="usuario" id="usuario" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Contraseña</label>
                            <input type="password" name="password" id="password" class="form-control" required>
                        </div>

                        <button type="submit" class="btn btn-success w-100">
                            Registrarme
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        <a th:href="@{/login}">¿Ya tenés cuenta? Iniciá sesión</a>
                    </div>

                </div>
            </div>

        </div>
    </div>

</main>

<footer class="py-4 bg-dark text-white"></footer>
</body>
</html>

<script src="/js/api.js"></script>
<script th:inline="javascript">
    window.BACKEND_URL = [[${backendUrl}]];
</script>
<script>
    document.getElementById("registroForm").addEventListener("submit", async function (e) {
        e.preventDefault();

        const req = {
            username: document.getElementById("usuario").value,
            password: document.getElementById("password").value,
            nombreReal: document.getElementById("nombre").value,
            email: document.getElementById("email").value,
            fechaNacimiento: document.getElementById("fechaNacimiento").value
        };

        const res = await apiFetch("/auth/registrar", {
            method: "POST",
            body: JSON.stringify(req)
        });

        if (!res || !res.ok) {
            alert("Hubo un error al registrar su usuario.");
            return;
        }

        alert("Usuario registrado con éxito. Se redirigirá al inicio de sesión en breve...");

        setTimeout(() => {
            window.location.href = "/login";
        }, 500);
    });
</script>
