<main class="page-content container my-5">
    <div class="row">
        <div class="col-lg-8 col-md-10 mx-auto">
            <h1 class="fw-bold mb-4">Reportar un nuevo Hecho</h1>
            <p class="text-muted">Aporta tu información a la comunidad. Todos los campos son requeridos.</p>

            <div id="form-feedback"></div>

            <form id="formCrearHecho" novalidate>
                <div class="mb-3">
                    <label for="titulo" class="form-label">Título</label>
                    <input type="text" class="form-control" id="titulo" placeholder="Ej: Foco de incendio en Sierra..." required>
                </div>

                <div class="mb-3">
                    <label for="descripcion" class="form-label">Descripción</label>
                    <textarea class="form-control" id="descripcion" rows="5" placeholder="Describe lo que sucedió, el contexto y cualquier detalle relevante." required></textarea>
                </div>

                <div class="mb-3">
                    <label for="categoria" class="form-label">Categoría</label>
                    <select class="form-select" id="categoria" required>
                        <option value="" selected disabled>Elige una categoría...</option>
                        <option value="incendio">Foco de Incendio</option>
                        <option value="contaminacion">Contaminación</option>
                        <option value="desaparicion">Desaparición</option>
                        <option value="social">Causa Social</option>
                        <option value="otro">Otro</option>
                    </select>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="latitud" class="form-label">Latitud</label>
                        <input type="number" step="any" class="form-control" id="latitud" placeholder="-34.6037" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="longitud" class="form-label">Longitud</label>
                        <input type="number" step="any" class="form-control" id="longitud" placeholder="-58.3816" required>
                    </div>
                    <div class="form-text mb-3">
                        <i class="bi bi-info-circle"></i> Puedes usar un servicio externo para obtener las coordenadas.
                    </div>
                </div>

                <div class="mb-4">
                    <label for="fecha" class="form-label">Fecha del Acontecimiento</Hlabel>
                        <input type="date" class="form-control" id="fecha" required>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100">
                    <i class="bi bi-cloud-arrow-up-fill"></i> Publicar Hecho
                </button>
            </form>
        </div>
    </div>
</main>
