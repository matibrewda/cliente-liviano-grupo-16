<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - MetaMapa</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <i class="bi bi-map-fill"></i> MetaMapa
        </a>
    </div>
</nav>

<main class="page-content container my-5">

    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">

            <h2 class="fw-bold mb-4 text-center">Iniciar Sesión</h2>

            <div class="card shadow-sm">
                <div class="card-body">

                    <form id="loginForm" th:action="@{/auth/login}" th:object="${user}" method="post">

                        <div class="mb-3">
                            <label for="username" class="form-label">Usuario / Email</label>
                            <input class="form-control" type="text" th:field="*{username}" id="username" required>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Contraseña</label>
                            <input class="form-control" type="password" th:field="*{password}" id="password" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            <i class="fas fa-save me-1"></i>
                            Iniciar sesion
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        <a th:href="@{/registro}">¿No tenés cuenta? Registrate</a>
                    </div>

                    <div id="loginError" class="text-danger mt-3 text-center d-none">
                        Usuario o contraseña incorrectos
                    </div>

                </div>
            </div>

        </div>
    </div>

</main>
</body>
</html>
