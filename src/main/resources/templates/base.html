<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${titulo} + ' - Gestión de Hechos'"></title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
<!-- Fragmento de navegación -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold" th:href="@{/}">
      <i class="bi bi-map-fill"></i> MetaMapa
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" th:href="@{/hechos}">Explorar Hechos</a>
        </li>
        <li class="nav-item" id="auth-area">
          <a class="nav-link btn btn-primary btn-sm px-3 ms-lg-2 text-white" th:href="@{/login}">
            Iniciar Sesión / Registro
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<header th:fragment="header" class="bg-light py-4">
  <div class="container">
    <div class="row">
      <div class="col">
        <h1 class="h2 mb-0" th:text="${titulo}"></h1>
      </div>
    </div>
  </div>
</header>

<!-- Contenido principal -->
<main class="container my-4 flex-grow-1">
  <div th:replace="~{${contenido} :: contenido}"></div>
</main>

<!-- Fragmento de footer -->
<footer th:fragment="footer" class="bg-dark text-light py-3 mt-auto">
  <div class="container">
    <div class="row">
      <div class="col-12 col-md-6 text-center text-md-start">
        <p class="mb-0">
          <i class="bi bi-code-slash me-1"></i>
          Sistema Metamapa
        </p>
      </div>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

<script th:inline="javascript">
  const token = [[${token}]];
  const nombre = [[${nombreReal}]];
  const username = [[${username}]];

  if (token) {
    sessionStorage.setItem('jwt', token);
    sessionStorage.setItem('nombreReal', nombre);
    sessionStorage.setItem('username', username);
  }
</script>

<script src="script.js"></script>

<script src="/js/auth.js"></script>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const authArea = document.getElementById("auth-area");

    if (isLoggedIn()) {
      const nombreReal = getNombreReal();

      authArea.innerHTML = `
    <div class="d-flex align-items-center">
        <span class="me-2 px-3 ms-lg-2 text-white">Hola, <strong>${nombreReal}</strong></span>
        <button class="btn btn-outline-danger btn-sm" onclick="logout()">Cerrar Sesión</button>
    </div>
    `;
    }
  });
</script>

</body>
</html>
