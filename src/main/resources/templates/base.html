<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(tituloStr, contenido, extraCss, extraJs)">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title th:text="${tituloStr != null ? tituloStr + ' - MetaMapa' : 'MetaMapa - Gestión de Hechos'}"></title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <link href="/css/style.css" rel="stylesheet">

  <th:block th:replace="${extraCss}" />
</head>
<body class="d-flex flex-column min-vh-100">
<!-- Fragmento de navegación -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold" th:href="@{/}">
      <i class="bi bi-map-fill"></i> MetaMapa
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" th:href="@{/hechos/mapa}">
            <i class="bi bi-globe-americas me-1"></i> Ver Mapa
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/colecciones}">Explorar Colecciones</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/hechos}">Explorar Hechos</a>
        </li>
        <li class="nav-item dropdown" th:if="${session.ROLES != null and #lists.contains(session.ROLES, 'ADMIN')}">
          <a class="nav-link dropdown-toggle" href="#" id="navbarSolicitudes" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="fas fa-clipboard-list me-1"></i> Admin Solicitudes
          </a>
          <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarSolicitudes">
            <li><a class="dropdown-item" th:href="@{/solicitudes/admin}">Eliminación</a></li>
            <li><a class="dropdown-item" th:href="@{/admin/solicitudes-modificacion}">Modificación</a></li>
          </ul>
        </li>
        <li class="nav-item" >
          <div  th:if="${session['NOMBRE_REAL'] == null}">
            <a class="nav-link btn btn-primary btn-sm px-3 ms-lg-2 text-white" th:href="@{/login}">
              Iniciar Sesión / Registro
            </a>
          </div>
          <div class="d-flex align-items-center"  th:if="${session['NOMBRE_REAL'] != null and !session['NOMBRE_REAL'].isBlank()}">
            <span class="me-2 px-3 ms-lg-2 text-white">Hola, <strong th:text="${session.NOMBRE_REAL}"></strong></span>
            <form th:action="@{/logout}" method="post" class="m-0 p-0 d-inline">
              <button type="submit" class="btn btn-outline-danger btn-sm">
                Cerrar Sesión
              </button>
            </form>
          </div>
        </li>
      </ul>
    </div>
  </div>
</nav>

<header th:if="${tituloStr != null}" class="bg-light py-3 border-bottom">
  <div class="container">
    <div class="row">
      <div class="col">
        <h1 class="h4 mb-0 text-secondary" th:text="${tituloStr}"></h1>
      </div>
    </div>
  </div>
</header>

<main class="container my-4 flex-grow-1">
  <th:block th:replace="${contenido}" />
</main>

<footer class="bg-dark text-light py-3 mt-auto">
  <div class="container">
    <div class="row">
      <div class="col-12 text-center text-md-start">
        <p class="mb-0 text-muted small">
          <i class="bi bi-code-slash me-1"></i> Sistema MetaMapa &copy; 2026
        </p>
      </div>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

<script src="script.js"></script>

<script src="/js/auth.js"></script>


<script src="/js/common.js" onerror="this.style.display='none'"></script>

<th:block th:replace="${extraJs}" />

</body>
</html>
