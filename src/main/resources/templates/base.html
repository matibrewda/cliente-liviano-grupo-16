<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(tituloStr, contenido, extraCss, extraJs)">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title th:text="${tituloStr != null ? tituloStr + ' - MetaMapa' : 'MetaMapa - Gestión de Hechos'}"></title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <link href="/css/style.css" rel="stylesheet">

  <th:block th:replace="${extraCss}" />
</head>
<body class="d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" th:href="@{/}">
      <i class="fas fa-map-marked-alt me-2"></i>
      MetaMapa
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" th:href="@{/hechos}">
            <i class="bi bi-list-ul me-1"></i> Lista de Hechos
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/mapa}">
            <i class="bi bi-globe-americas me-1"></i> Ver Mapa
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link btn btn-light btn-sm text-primary px-3 ms-lg-2 mt-2 mt-lg-0" th:href="@{/hechos/nuevo}">
            <i class="bi bi-plus-circle me-1"></i> Nuevo Hecho
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<header th:if="${tituloStr != null}" class="bg-light py-3 border-bottom">
  <div class="container">
    <div class="row">
      <div class="col">
        <h1 class="h4 mb-0 text-secondary" th:text="${tituloStr}"></h1>
      </div>
    </div>
  </div>
</header>

<main class="container my-4 flex-grow-1">
  <th:block th:replace="${contenido}" />
</main>

<footer class="bg-dark text-light py-3 mt-auto">
  <div class="container">
    <div class="row">
      <div class="col-12 text-center text-md-start">
        <p class="mb-0 text-muted small">
          <i class="bi bi-code-slash me-1"></i> Sistema MetaMapa &copy; 2026
        </p>
      </div>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js" onerror="this.style.display='none'"></script>

<th:block th:replace="${extraJs}" />

</body>
</html>
