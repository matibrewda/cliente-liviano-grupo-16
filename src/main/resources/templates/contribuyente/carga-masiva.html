<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout('Carga Masiva', ~{::main}, ~{::#extraCss}, ~{::#extraJs})}">

<head>
    <th:block id="extraCss">
        <style>
            .border-dashed {
                border-style: dashed !important;
                border-width: 2px !important;
                border-color: #dee2e6;
            }
            .upload-zone {
                cursor: pointer;
                transition: all 0.3s ease;
            }
            .upload-zone:hover, .upload-zone.drag-over {
                background-color: #f8f9fa !important;
                border-color: #0d6efd !important;
            }
        </style>
    </th:block>
</head>
<body>

<main class="page-content container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="fw-bold mb-0">Carga Masiva de Hechos</h1>
                <a th:href="@{/hechos}" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-arrow-left"></i> Volver
                </a>
            </div>

            <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${mensajeExito}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${mensajeError}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-5">

                    <form th:action="@{/hechos/carga-masiva}" method="POST" enctype="multipart/form-data" id="formCargaMasiva">

                        <div class="upload-zone text-center p-5 border-dashed rounded-3 bg-light mb-4" id="dropZone">
                            <i class="bi bi-cloud-arrow-up display-3 text-primary mb-3"></i>
                            <h5>Arrastra y suelta tu archivo CSV</h5>
                            <p class="text-muted small">o haz clic para buscar en tu equipo</p>

                            <input type="file" name="archivo" id="archivoInput" class="form-control d-none" accept=".csv" required>

                            <p id="fileName" class="mt-3 fw-bold text-success d-none"></p>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg" id="btnProcesar" disabled>
                                <i class="bi bi-upload me-1"></i> Subir Archivo
                            </button>
                        </div>
                    </form>

                </div>
            </div>

        </div>
    </div>
</main>

<th:block id="extraJs">
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const dropZone = document.getElementById('dropZone');
            const archivoInput = document.getElementById('archivoInput');
            const fileNameDisplay = document.getElementById('fileName');
            const btnProcesar = document.getElementById('btnProcesar');

            // Click en la zona abre el explorador de archivos
            dropZone.addEventListener('click', () => archivoInput.click());

            // Efectos Drag & Drop visuales
            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.classList.add('drag-over');
            });

            dropZone.addEventListener('dragleave', () => {
                dropZone.classList.remove('drag-over');
            });

            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('drag-over');

                if (e.dataTransfer.files.length > 0) {
                    // Validar que sea CSV (opcional pero recomendado)
                    const file = e.dataTransfer.files[0];
                    if(file.name.endsWith('.csv')) {
                        archivoInput.files = e.dataTransfer.files;
                        actualizarNombreArchivo();
                    } else {
                        alert("Por favor, sube únicamente un archivo con formato .csv");
                    }
                }
            });

            // Cambio manual usando el explorador de archivos
            archivoInput.addEventListener('change', actualizarNombreArchivo);

            function actualizarNombreArchivo() {
                if (archivoInput.files.length > 0) {
                    fileNameDisplay.innerHTML = `<i class="bi bi-file-earmark-check me-1"></i> Archivo seleccionado: ${archivoInput.files[0].name}`;
                    fileNameDisplay.classList.remove('d-none');
                    btnProcesar.removeAttribute('disabled');

                    // Cambiar estilo de la zona de drop para dar feedback positivo
                    dropZone.classList.remove('bg-light');
                    dropZone.style.backgroundColor = '#f0fdf4'; // Verde muy clarito
                    dropZone.style.borderColor = '#198754'; // Borde verde
                }
            }
        });
    </script>
</th:block>

</body>
</html>
