<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carga Masiva - MetaMapa</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}"><i class="bi bi-map-fill"></i> MetaMapa</a>
    </div>
</nav>

<main class="page-content container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <h1 class="fw-bold mb-4">Carga Masiva de Hechos</h1>

            <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle-fill"></i> <span th:text="${mensajeExito}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${mensajeError}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div class="card shadow-sm border-0">
                <div class="card-body p-5">

                    <form th:action="@{/hechos/carga-masiva}" method="POST" enctype="multipart/form-data" id="formCargaMasiva">

                        <div class="upload-zone text-center p-5 border border-2 border-dashed rounded-3 bg-light mb-4" id="dropZone">
                            <i class="bi bi-cloud-arrow-up display-3 text-primary mb-3"></i>
                            <h5>Arrastra y suelta tu archivo CSV/JSON</h5>
                            <p class="text-muted small">o haz clic para buscar</p>

                            <input type="file" name="archivo" id="archivoInput" class="form-control d-none" accept=".csv" required>

                            <p id="fileName" class="mt-3 fw-bold text-success d-none"></p>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg" id="btnProcesar" disabled>
                                <i class="bi bi-upload"></i> Subir Archivo
                            </button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Javascript simplificado solo para efectos visuales
    // Ya NO bloqueamos el submit, dejamos que el formulario viaje al servidor.
    document.addEventListener('DOMContentLoaded', () => {
        const dropZone = document.getElementById('dropZone');
        const archivoInput = document.getElementById('archivoInput');
        const fileNameDisplay = document.getElementById('fileName');
        const btnProcesar = document.getElementById('btnProcesar');

        // Click en la zona abre el input
        dropZone.addEventListener('click', () => archivoInput.click());

        // Efectos Drag & Drop
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('bg-secondary', 'bg-opacity-10'); // Feedback visual simple
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('bg-secondary', 'bg-opacity-10');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('bg-secondary', 'bg-opacity-10');
            if (e.dataTransfer.files.length > 0) {
                archivoInput.files = e.dataTransfer.files; // Asigna los archivos al input real
                actualizarNombreArchivo();
            }
        });

        // Cambio en el input
        archivoInput.addEventListener('change', actualizarNombreArchivo);

        function actualizarNombreArchivo() {
            if (archivoInput.files.length > 0) {
                fileNameDisplay.textContent = "Archivo seleccionado: " + archivoInput.files[0].name;
                fileNameDisplay.classList.remove('d-none');
                btnProcesar.removeAttribute('disabled');
            }
        }
    });
</script>
</body>
</html>
