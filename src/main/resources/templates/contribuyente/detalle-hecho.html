<html th:replace="~{base ::html}">
<div th:fragment="contenido" class="row">
  <div class="col-12">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="h3 mb-0">
        <i class="fas fa-user me-2"></i>
        <span th:text="${titulo}">Detalle del Hecho</span>
      </h1>
      <div>
        <a href="/hechos" class="btn btn-secondary">
          <i class="fas fa-arrow-left me-1"></i>
          Volver a la Lista
        </a>
      </div>
    </div>

    <div class="row">
      <div class="col-md-8">
        <!-- Información básica -->
        <div class="card mb-4">
          <div class="card-header">
            <h5 class="card-title mb-0">
              <i class="fas fa-id-card me-2"></i>
              Información Basica
            </h5>
          </div>
          <div class="card-body">
            <div class="row">
              <div class="col-md-6">
                <div class="mb-3">
                  <label class="form-label fw-bold">ID:</label>
                  <p class="form-control-plaintext">
                    <span class="badge bg-primary fs-6" th:text="${hecho.id}">LEG001</span>
                  </p>
                </div>
              </div>
              <div class="col-md-6">
                <div class="mb-3">
                  <label class="form-label fw-bold">Titulo:</label>
                  <p class="form-control-plaintext" th:text="${hecho.titulo}">Titulo</p>
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col-md-6">
                <div class="mb-3">
                  <label class="form-label fw-bold">Descripcion:</label>
                  <p class="form-control-plaintext" th:text="${hecho.descripcion}">Descripcion</p>
                </div>
              </div>
              <div class="col-md-6">
                <div class="mb-3">
                  <label class="form-label fw-bold">Fecha del Acontecimiento:</label>
                  <p class="form-control-plaintext" th:text="${hecho.fechaAcontecimiento}">12/12/2025</p>
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col-md-6">
                <div class="mb-3">
                  <label class="form-label fw-bold">Latitud:</label>
                  <p class="form-control-plaintext" th:text="${hecho.ubicacion.latitud}">-34.35351</p>
                </div>
                <div class="mb-3">
                  <label class="form-label fw-bold">Longitud:</label>
                  <p class="form-control-plaintext" th:text="${hecho.ubicacion.longitud}">-58.123124</p>
                </div>
              </div>
            </div>
          </div>
        </div>

      </div>

    </div>
  </div>
</div>
</html>
