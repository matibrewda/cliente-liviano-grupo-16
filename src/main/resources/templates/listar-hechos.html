<html th:replace="~{base :: layout(${titulo}, ~{::contenido}, ~{}, ~{})}">
<div th:fragment="contenido" class="row">
    <section class="py-4 bg-light">
        <div class="container">

            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
                <h1 class="fw-bold mb-0">Hechos Reportados</h1>

                <div class="d-flex flex-wrap gap-2">
                    <a th:if="${session.ROLES != null and #arrays.contains(session.ROLES, 'ADMIN')}"
                       th:href="@{/hechos/carga-masiva}"
                       class="btn btn-success">
                        <i class="fas fa-file-upload me-1"></i> Carga masiva
                    </a>
                    <a th:href="@{/hechos/nuevo}" class="btn btn-primary">
                        <i class="fas fa-plus-circle me-1"></i> Agregar Hecho
                    </a>
                </div>
            </div>
            <!-- Tabla de hechos -->
            <div class="table-responsive shadow-sm bg-white rounded-3">
                <table class="table table-hover mb-0 align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Título</th>
                        <th scope="col">Fecha Incidente</th>
                        <th scope="col">Ubicación</th>
                        <th scope="col">Categoría</th>
                        <th scope="col">Origen / Fuente</th>
                        <th scope="col">Fecha carga</th>
                        <th scope="col" class="text-center">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>

                    <tr th:each="h : ${hechos}">
                        <td th:text="${h.id}">1</td>
                        <td th:text="${h.titulo}">Choque leve en Av. Corrientes</td>

                        <td th:text="${h.fechaAcontecimiento}">2025-03-12</td>

                        <td>
                            <span th:if="${h.ubicacionDTO != null}">
                                Lat: <span th:text="${h.ubicacionDTO.latitud}">-34.60</span>,
                                Lon: <span th:text="${h.ubicacionDTO.longitud}">-58.38</span>
                            </span>
                            <span th:if="${h.ubicacionDTO == null}">
                                Sin datos
                            </span>
                        </td>

                        <td th:text="${h.categoriaDTO != null and h.categoriaDTO.nombre != null ? h.categoriaDTO.nombre : 'N/D'}">
                            Categoria-1
                        </td>

                        <td th:text="${h.origen != null ? h.origen : 'N/D'}">Estática</td>

                        <td th:text="${h.fechaCarga}">2025-03-12T14:30</td>

                        <td class="text-center">
                            <div class="d-flex justify-content-center gap-1">
                                <a class="btn btn-sm btn-primary"
                                   th:href="@{|/hechos/detalle/${h.id}|}"
                                   title="Ver detalle">
                                    <i class="fas fa-eye"></i>
                                </a>
                                <a th:if="${h.origen != null and #strings.contains(#strings.toLowerCase(h.origen), 'dinamica')}"
                                   class="btn btn-sm btn-warning"
                                   th:href="@{/solicitudes-modificacion/nueva(hechoId=${h.externalId != null ? h.externalId : h.id}, volverA='/hechos')}"
                                   title="Modificar">
                                    <i class="fas fa-pencil-alt"></i>
                                </a>
                                <a class="btn btn-sm btn-danger"
                                   th:href="@{|/solicitudes/solicitud-eliminacion/hecho/${h.id}|}"
                                   title="Solicitar eliminación">
                                    <i class="fas fa-trash"></i>
                                </a>
                            </div>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(hechos)}">
                        <td colspan="8" class="text-center text-muted py-4">
                            No se encontraron hechos.
                        </td>
                    </tr>

                    </tbody>
                </table>
            </div>

        </div>
    </section>

</div>
</html>
