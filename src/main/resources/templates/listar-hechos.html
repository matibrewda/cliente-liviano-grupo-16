<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de Hechos - MetaMapa</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <i class="bi bi-map-fill"></i> MetaMapa
        </a>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="visualizacion.html">Explorar Hechos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link btn btn-primary btn-sm px-3 ms-lg-2 text-white" href="login.html">Iniciar Sesión / Registro</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="page-content container my-5">
    <div class="row">
        <div class="col-lg-8 col-md-10 mx-auto">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="fw-bold mb-0">Hechos Reportados</h1>
                <a th:href="@{/hechos/crear}" class="btn btn-primary">
                    <i class="bi bi-plus-circle-fill me-1"></i> Agregar Hecho
                </a>
            </div>

            <p class="text-muted">Estos son los últimos hechos reportados por la comunidad.</p>

            <div class="list-group shadow-sm">

                <div class="list-group-item d-flex justify-content-between align-items-center">
                    <a href="detalle-hecho-1.html" class="text-decoration-none text-dark fw-bold me-3 text-truncate">
                        <i class="bi bi-fire text-danger me-2"></i> Foco de incendio en Sierra de la Ventana
                    </a>
                    <div class="btn-group flex-shrink-0" role="group">
                        <a href="editar-hecho.html?id=1" class="btn btn-outline-secondary btn-sm">
                            <i class="bi bi-pencil"></i> Editar
                        </a>
                        <button type="button" class="btn btn-outline-danger btn-sm" onclick="confirmarEliminacion('hecho', 1)">
                            <i class="bi bi-trash"></i> Eliminar
                        </button>
                    </div>
                </div>

                <div class="list-group-item d-flex justify-content-between align-items-center">
                    <a href="detalle-hecho-2.html" class="text-decoration-none text-dark fw-bold me-3 text-truncate">
                        <i class="bi bi-radioactive text-warning me-2"></i> Vertido ilegal en Río Reconquista
                    </a>
                    <div class="btn-group flex-shrink-0" role="group">
                        <a href="editar-hecho.html?id=2" class="btn btn-outline-secondary btn-sm">
                            <i class="bi bi-pencil"></i> Editar
                        </a>
                        <button type="button" class="btn btn-outline-danger btn-sm" onclick="confirmarEliminacion('hecho', 2)">
                            <i class="bi bi-trash"></i> Eliminar
                        </button>
                    </div>
                </div>

                <div class="list-group-item d-flex justify-content-between align-items-center">
                    <a href="detalle-hecho-3.html" class="text-decoration-none text-dark fw-bold me-3 text-truncate">
                        <i class="bi bi-megaphone-fill text-primary me-2"></i> Manifestación por falta de agua
                    </a>
                    <div class="btn-group flex-shrink-0" role="group">
                        <a href="editar-hecho.html?id=3" class="btn btn-outline-secondary btn-sm">
                            <i class="bi bi-pencil"></i> Editar
                        </a>
                        <button type="button" class="btn btn-outline-danger btn-sm" onclick="confirmarEliminacion('hecho', 3)">
                            <i class="bi bi-trash"></i> Eliminar
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>
</main>


<footer class="py-4 bg-dark text-white">
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script src="script.js"></script>
</body>
</html>
