<html th:replace="~{base :: layout(${titulo}, ~{::contenido}, ~{}, ~{})}">
<div th:fragment="contenido" class="row">
  <div class="col-12">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="h3 mb-0">
        <i class="fas fa-edit me-2"></i>
        <span th:text="${titulo}">Editar Colección</span>
      </h1>

      <!-- IMPORTANTE: no modifico href como pediste -->
      <div>
        <a th:href="@{/colecciones/{id}(id=${coleccion.handle})}" class="btn btn-info me-2">
          <i class="fas fa-eye me-1"></i>
          Ver Detalle
        </a>
        <a th:href="@{/colecciones}" class="btn btn-secondary">
          <i class="fas fa-arrow-left me-1"></i>
          Volver a la Lista
        </a>
      </div>
    </div>

    <div class="row">

      <div class="col-md-12">
        <div class="card">
          <div class="card-header">
            <h5 class="card-title mb-0">
              <i class="fas fa-layer-group me-2"></i>
              Información de la Colección
            </h5>
          </div>

          <div class="card-body">

            <form th:action="@{/colecciones/{id}/actualizar(id=${coleccion.handle})}"
                  th:object="${coleccion}"
                  method="post">

              <!-- Información básica -->
              <div class="row">
                <div class="col-md-6">
                  <div class="mb-3">
                    <label for="titulo" class="form-label">
                      Título <span class="text-danger">*</span>
                    </label>
                    <input type="text"
                           class="form-control"
                           id="titulo"
                           th:field="*{titulo}"
                           placeholder="Ej: Colección de incidentes viales"
                           required>
                    <div th:if="${#fields.hasErrors('titulo')}" class="text-danger">
                      <small th:errors="*{titulo}">Error en título</small>
                    </div>
                  </div>
                </div>

                <div class="col-md-6">
                  <div class="mb-3">
                    <label for="descripcion" class="form-label">
                      Descripción <span class="text-danger">*</span>
                    </label>

                    <textarea class="form-control"
                              id="descripcion"
                              th:field="*{descripcion}"
                              rows="4"
                              maxlength="500"
                              placeholder="Ej: Colección que agrupa hechos relacionados..."
                              required></textarea>

                    <div class="form-text text-end">
                      <span id="contadorDescripcion">0</span>/500 caracteres
                    </div>

                    <div th:if="${#fields.hasErrors('descripcion')}" class="text-danger">
                      <small th:errors="*{descripcion}">Error en descripción</small>
                    </div>
                  </div>
                </div>
                <div class="card mb-4 shadow-sm">
                  <div class="card-body">
                    <h2 class="h5 mb-3">
                      <i class="bi bi-funnel"></i> Criterios de pertenencia
                    </h2>
                    <div class="row">
                      <div class="col-md-3">
                        <label for="fechaIncidenteDesde" class="form-label">Fecha acontecimiento desde</label>
                        <input type="date"
                               class="form-control"
                               id="fechaIncidenteDesde"
                               name="fechaIncidenteDesde"
                               th:field="*{fechaAcontecimientoDesde}">
                      </div>

                      <div class="col-md-3">
                        <label for="fechaIncidenteHasta" class="form-label">Fecha acontecimiento hasta</label>
                        <input type="date"
                               class="form-control"
                               id="fechaIncidenteHasta"
                               name="fechaIncidenteHasta"
                               th:field="*{fechaAcontecimientoHasta}">
                      </div>

                      <div class="col-md-3">
                        <label for="latitud" class="form-label">Latitud</label>
                        <input type="number"
                               step="any"
                               class="form-control"
                               id="latitud"
                               name="latitud"
                               placeholder="-34.60"
                               th:field="*{latitud}">
                      </div>

                      <div class="col-md-3">
                        <label for="longitud" class="form-label">Longitud</label>
                        <input type="number"
                               step="any"
                               class="form-control"
                               id="longitud"
                               name="longitud"
                               placeholder="-58.38"
                               th:field="*{longitud}">
                      </div>

                      <div class="col-md-3">
                        <label for="radioKm" class="form-label">Radio (km)</label>
                        <input type="number"
                               step="any"
                               min="0"
                               class="form-control"
                               id="radioKm"
                               name="radioKm"
                               placeholder="5"
                               th:field="*{radioKm}">
                      </div>
                      <div class="col-md-3">
                        <label for="categoria" class="form-label">Categoría</label>
                        <select class="form-select" name="categoria" id="categoria">
                          <option value="">Todas</option>
                          <option th:each="cat : ${categoriasDisponibles}"
                                  th:value="${cat.id}"
                                  th:text="${cat.nombre}"
                                  th:selected="*{categoria}">
                          </option>
                        </select>
                      </div>

                      <div class="col-md-3">
                        <label for="origen" class="form-label">Origen</label>
                        <select class="form-select" name="origen" id="origen">
                          <option value="">Todas</option>
                          <option th:each="orig : ${origenesDisponibles}"
                                  th:value="${orig}"
                                  th:text="${orig}"
                                  th:selected="${orig}">
                          </option>
                        </select>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <hr>

              <!-- Botones -->
              <div class="d-flex justify-content-between">
                <div>

                  <a th:href="@{/colecciones/{id}(id=${coleccion.handle})}" class="btn btn-secondary me-2">
                    <i class="fas fa-times me-1"></i>
                    Cancelar
                  </a>
                </div>

                <button type="submit" class="btn btn-primary">
                  <i class="fas fa-save me-1"></i>
                  Actualizar Colección
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const textarea = document.getElementById("descripcion");
    const contador = document.getElementById("contadorDescripcion");
    if (!textarea || !contador) return;
    const actualizar = () => contador.textContent = textarea.value.length;
    textarea.addEventListener("input", actualizar);
    actualizar();
  });
</script>

</html>
