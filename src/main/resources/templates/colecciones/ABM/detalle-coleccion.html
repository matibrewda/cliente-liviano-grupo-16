<html th:replace="~{base :: layout(${titulo}, ~{::contenido}, ~{}, ~{})}">
<div th:fragment="contenido" class="row">
  <div class="col-12">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="h3 mb-0">
        <i class="fas fa-layer-group me-2"></i>
        <span th:text="${titulo}">Detalle de la Colección</span>
      </h1>

<!--Botones-->
      <div>

        <div class="btn-group me-2">
          <button type="button"
                  class="btn btn-outline-primary dropdown-toggle"
                  data-bs-toggle="dropdown"
                  aria-expanded="false">
            <i class="fas fa-cog me-1"></i>
            Configurar
          </button>

          <ul class="dropdown-menu dropdown-menu-end">
            <li>
              <a class="dropdown-item"
                 th:href="@{/admin/colecciones/{id}/consenso(id=${coleccion.handle})}">
                <i class="fas fa-sliders-h me-2"></i>
                Algoritmo de consenso
              </a>
            </li>
            <li>
              <a class="dropdown-item"
                 th:href="@{/admin/colecciones/{id}/fuentes(id=${coleccion.handle})}">
                <i class="fas fa-database me-2"></i>
                Fuentes
              </a>
            </li>
          </ul>
        </div>
        <a th:href="@{/colecciones/{id}/eliminar(id=${coleccion.handle})}"
           class="btn btn-danger me-2">
          <i class="fas fa-trash me-1"></i>
          Eliminar
        </a>
        <a th:href="@{/colecciones/{id}/editar(id=${coleccion.handle})}" class="btn btn-warning me-2">
          <i class="fas fa-edit me-1"></i>
          Editar
        </a>
        <a href="/colecciones" class="btn btn-secondary">
          <i class="fas fa-arrow-left me-1"></i>
          Volver a la Lista
        </a>
      </div>
    </div>

    <div class="row">
      <div class="col-md-12">
        <!-- Información básica -->
      <div class="card mb-4">
          <div class="card-header">
            <h5 class="card-title mb-0">
              <i class="fas fa-id-card me-2"></i>
              Información Básica
            </h5>
          </div>

          <div class="card-body">
            <div class="row">
              <div class="col-md-6">
                <div class="mb-3">
                  <label class="form-label fw-bold">Título:</label>
                  <p class="form-control-plaintext" th:text="${coleccion.titulo}">Título</p>
                </div>
              </div>

              <div class="col-md-6">
                <div class="mb-3">
                  <label class="form-label fw-bold">Descripción:</label>
                  <p class="form-control-plaintext" th:text="${coleccion.descripcion}">Descripción</p>
                </div>
              </div>
            </div>


          </div>

      </div>

      </div>
    </div>

  </div>
</div>
</html>
