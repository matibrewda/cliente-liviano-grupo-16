<html th:replace="~{base ::html}">
<div th:fragment="contenido" class="row">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0">
            <i class="fas fa-trash-alt me-2 text-danger"></i>
            <span th:text="${titulo}">Eliminar colección</span>
        </h1>

        <div class="d-flex gap-2">
            <!-- Volver al detalle de la colección -->
            <a th:href="@{/colecciones/{id}(id=${coleccion.handle})}" class="btn btn-secondary">
                <i class="fas fa-arrow-left me-1"></i>
                Volver al detalle
            </a>
        </div>
    </div>

    <!-- CARD CONFIRMACIÓN -->
    <div class="col-12 col-lg-8">
        <div class="card mb-4 border-danger">
            <div class="card-header bg-danger text-white">
                <h5 class="card-title mb-0">
                    <i class="fas fa-exclamation-triangle me-2"></i>
                    Confirmar eliminación de colección
                </h5>
            </div>

            <div class="card-body">

                <div class="alert alert-warning">
                    <i class="fas fa-exclamation-triangle me-1"></i>
                    Esta acción es <strong>definitiva</strong> y no se puede deshacer.
                </div>


                <div class="mb-3">
                    <label class="form-label fw-bold mb-1">Título</label>
                    <div class="form-control-plaintext" th:text="${coleccion.titulo}">Título</div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold mb-1">Descripción</label>
                    <div class="form-control-plaintext text-muted" th:text="${coleccion.descripcion}">Descripción</div>
                </div>


                <hr>

                <div class="d-flex justify-content-end gap-2">
                    <!-- Cancelar (vuelve al detalle) -->
                    <a th:href="@{/colecciones/{id}(id=${coleccion.handle})}" class="btn btn-outline-secondary">
                        Cancelar
                    </a>

                    <!-- Confirmar eliminación (POST) -->
                    <form th:action="@{/colecciones/{id}/eliminar(id=${coleccion.handle})}"
                          method="post"
                          class="d-inline">
                        <button type="submit" class="btn btn-danger">
                            <i class="fas fa-trash-alt me-1"></i>
                            Eliminar colección
                        </button>
                    </form>
                </div>

            </div>
        </div>
    </div>

</div>
</html>
