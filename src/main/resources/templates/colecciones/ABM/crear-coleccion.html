<html th:replace="~{base :: layout(${titulo}, ~{::contenido}, ~{}, ~{})}">
<div th:fragment="contenido" class="row">
    <div class="col-12">
        <div th:if="${mensaje}" class="alert alert-dismissible fade show mb-3"
             th:classappend="${tipoMensaje == 'danger' ? 'alert-danger' : (tipoMensaje == 'success' ? 'alert-success' : 'alert-info')}" role="alert">
            <i class="bi bi-exclamation-triangle-fill" th:if="${tipoMensaje == 'danger'}"></i>
            <i class="bi bi-check-circle-fill" th:if="${tipoMensaje == 'success'}"></i>
            <span th:text="${mensaje}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 mb-0">
                <i class="bi bi-plus-circle me-2"></i>
                <span th:text="${titulo}">Crear Nueva Colección</span>
            </h1>
            <a th:href="@{/colecciones}" class="btn btn-secondary">
                <i class="bi bi-arrow-left me-1"></i>
                Volver a la Lista
            </a>
        </div>

        <form th:action="@{/colecciones/crear}" th:object="${coleccion}" method="post">
            <!-- Información básica -->
            <div class="card mb-4 shadow-sm">
                <div class="card-header bg-light">
                    <h5 class="card-title mb-0"><i class="fas fa-id-card me-2"></i>Información de la Colección</h5>
                </div>
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="titulo" class="form-label fw-bold">Título <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="titulo" th:field="*{titulo}"
                                   placeholder="Ej: Incidentes viales" required minlength="1">
                            <div th:if="${#fields.hasErrors('titulo')}" class="text-danger small" th:errors="*{titulo}"></div>
                        </div>
                        <div class="col-md-6">
                            <label for="descripcion" class="form-label fw-bold">Descripción <span class="text-danger">*</span></label>
                            <textarea class="form-control" id="descripcion" th:field="*{descripcion}" rows="3"
                                      maxlength="500" placeholder="Ej: Descripción de la colección (máx. 500 caracteres)" required minlength="1"></textarea>
                            <div class="form-text text-end"><span id="contadorDescripcion">0</span>/500</div>
                            <div th:if="${#fields.hasErrors('descripcion')}" class="text-danger small" th:errors="*{descripcion}"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Algoritmo de consenso -->
            <div class="card mb-4 shadow-sm">
                <div class="card-header bg-light">
                    <h5 class="card-title mb-0"><i class="bi bi-gear me-2"></i>Algoritmo de consenso</h5>
                </div>
                <div class="card-body">
                    <label for="tipoConsenso" class="form-label fw-bold">Tipo de algoritmo</label>
                    <select class="form-select" id="tipoConsenso" th:field="*{tipoConsenso}">
                        <option value="">Seleccione un tipo...</option>
                        <option value="ABSOLUTA">Absoluta</option>
                        <option value="MAYORIA_SIMPLE">Mayoría simple</option>
                        <option value="MULTIPLES_MENCIONES">Múltiples menciones</option>
                    </select>
                </div>
            </div>

            <!-- Fuentes -->
            <div class="card mb-4 shadow-sm">
                <div class="card-header bg-light">
                    <h5 class="card-title mb-0"><i class="bi bi-database me-2"></i>Fuentes</h5>
                </div>
                <div class="card-body">
                    <label class="form-label fw-bold">Fuentes de esta colección</label>
                    <div class="row">
                        <div class="col-md-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="fuenteProxy" th:field="*{fuenteProxy}">
                                <label class="form-check-label" for="fuenteProxy">Fuente proxy</label>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="fuenteEstatica" th:field="*{fuenteEstatica}">
                                <label class="form-check-label" for="fuenteEstatica">Fuente estática</label>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="fuenteDinamica" th:field="*{fuenteDinamica}">
                                <label class="form-check-label" for="fuenteDinamica">Fuente dinámica</label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Criterios de pertenencia -->
            <div class="card mb-4 shadow-sm">
                <div class="card-header bg-light">
                    <h5 class="card-title mb-0"><i class="bi bi-funnel me-2"></i>Criterios de pertenencia</h5>
                </div>
                <div class="card-body">
                    <p class="text-muted small mb-3">Opcional. Dejá vacío lo que no quieras usar.</p>
                    <div class="row g-3">
                        <div class="col-md-3">
                            <label for="fechaAcontecimientoDesde" class="form-label">Fecha acontecimiento desde</label>
                            <input type="date" class="form-control" id="fechaAcontecimientoDesde"
                                   th:field="*{fechaAcontecimientoDesde}">
                        </div>
                        <div class="col-md-3">
                            <label for="fechaAcontecimientoHasta" class="form-label">Fecha acontecimiento hasta</label>
                            <input type="date" class="form-control" id="fechaAcontecimientoHasta"
                                   th:field="*{fechaAcontecimientoHasta}">
                        </div>
                        <div class="col-md-3">
                            <label for="categoria" class="form-label">Categoría</label>
                            <select class="form-select" id="categoria" th:field="*{categoria}">
                                <option value="">Todas</option>
                                <option th:each="cat : ${categoriasDisponibles}" th:value="${cat.id}" th:text="${cat.nombre}"></option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label for="latitud" class="form-label">Latitud</label>
                            <input type="number" step="any" class="form-control" id="latitud" placeholder="-34.60"
                                   th:field="*{latitud}">
                        </div>
                        <div class="col-md-3">
                            <label for="longitud" class="form-label">Longitud</label>
                            <input type="number" step="any" class="form-control" id="longitud" placeholder="-58.38"
                                   th:field="*{longitud}">
                        </div>
                        <div class="col-md-3">
                            <label for="radioKm" class="form-label">Radio (km)</label>
                            <input type="number" step="any" min="0" class="form-control" id="radioKm" placeholder="5"
                                   th:field="*{radioKm}">
                        </div>
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-between">
                <a th:href="@{/colecciones}" class="btn btn-secondary">
                    <i class="bi bi-x me-1"></i>
                    Cancelar
                </a>
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-save me-1"></i>
                    Crear Colección
                </button>
            </div>
        </form>
    </div>

    <script th:inline="javascript">
        document.addEventListener("DOMContentLoaded", function () {
            var textarea = document.getElementById("descripcion");
            var contador = document.getElementById("contadorDescripcion");
            if (textarea && contador) {
                var actualizar = function () { contador.textContent = textarea.value.length; };
                textarea.addEventListener("input", actualizar);
                actualizar();
            }
        });
    </script>
</div>
</html>
