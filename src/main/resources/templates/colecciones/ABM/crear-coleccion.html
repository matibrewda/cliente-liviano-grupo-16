<html th:replace="~{base :: layout(${titulo}, ~{::contenido}, ~{}, ~{})}">
<div th:fragment="contenido" class="row">
    <div class="col-12">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 mb-0">
                <i class="fas fa-user-plus me-2"></i>
                <span th:text="${titulo}">Crear Nueva Colección</span>
            </h1>
            <a th:href="@{/colecciones}" class="btn btn-secondary">
                <i class="fas fa-arrow-left me-1"></i>
                Volver a la Lista
            </a>
        </div>

        <div class="row">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">
                            <i class="fas fa-id-card me-2"></i>
                            Información de la Colección
                        </h5>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/colecciones/crear}" th:object="${coleccion}" method="post">
                            <!-- Información básica -->
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="titulo" class="form-label">Titulo <span
                                                class="text-danger">*</span></label>
                                        <input type="text" class="form-control" id="titulo" th:field="*{titulo}"
                                               placeholder="Ej: Titulo del Hecho" required>
                                        <div th:if="${#fields.hasErrors('titulo')}" class="text-danger">
                                            <small th:errors="*{titulo}">Error en titulo</small>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="descripcion" class="form-label">
                                            Descripción <span class="text-danger">*</span>
                                        </label>

                                        <textarea class="form-control"
                                                  id="descripcion"
                                                  th:field="*{descripcion}"
                                                  rows="4"
                                                  maxlength="500"
                                                  placeholder="Ej: Descripción de la colección (máx. 500 caracteres)"
                                                  required></textarea>

                                        <!-- Contador de caracteres -->
                                        <div class="form-text text-end">
                                            <span id="contadorDescripcion">0</span>/500 caracteres
                                        </div>

                                        <!-- Errores de validación -->
                                        <div th:if="${#fields.hasErrors('descripcion')}" class="text-danger">
                                            <small th:errors="*{descripcion}">Error en la descripción</small>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <hr>
                            <div class="d-flex justify-content-between">
                                <a th:href="@{/colecciones}" class="btn btn-secondary">
                                    <i class="fas fa-times me-1"></i>
                                    Cancelar
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save me-1"></i>
                                    Crear Coleccion
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>


        </div>
    </div>


    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const textarea = document.getElementById("descripcion");
            const contador = document.getElementById("contadorDescripcion");
            if (!textarea || !contador) return;
            const actualizar = () => contador.textContent = textarea.value.length;
            textarea.addEventListener("input", actualizar);
            actualizar();
        });
    </script>
</div>
</html>
