<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' - Gestión de Hechos'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

<nav th:fragment="navegacion" class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" th:href="@{/colecciones}">
            <i class="fas fa-layer-group me-2"></i>
            Gestión de Colecciones
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <div class="navbar-nav ms-auto">
                <a class="nav-link" th:href="@{/colecciones}">
                    <i class="bi bi-list-ul me-1"></i>
                    Listar Colecciones
                </a>
                <a class="nav-link" th:href="@{/colecciones/nueva}">
                    <i class="bi bi-plus-circle me-1"></i>
                    Nueva Colección
                </a>
            </div>
        </div>
    </div>
</nav>

<header th:fragment="header" class="bg-light py-4 border-bottom">
    <div class="container">
        <h1 class="h2 mb-0" th:text="${titulo}">Título</h1>
        <small class="text-muted">Visualización de colecciones</small>
    </div>
</header>

<!-- Contenido principal -->
<main class="container my-4 flex-grow-1">
    <div th:replace="${contenido} :: contenido"></div>
</main>

<footer th:fragment="footer" class="bg-dark text-light py-3 mt-auto">
    <div class="container">
        <p class="mb-0">
            <i class="bi bi-collection me-1"></i>
            Gestión de Colecciones
        </p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Tu JS (está en static/script.js) -->
<script th:src="@{/script.js}"></script>

</body>
</html>
