<html th:replace="~{base :: layout(${titulo}, ~{::contenido}, ~{}, ~{})}">
<div th:fragment="contenido" class="row">
    <section class="py-4 bg-light">
        <div class="container">

            <!-- Botón volver -->
            <div class="mb-3 d-flex justify-content-between align-items-center">
                <a class="btn btn-outline-secondary btn-sm"
                   th:href="@{/colecciones}">
                    <i class="bi bi-arrow-left"></i> Volver a colecciones
                </a>
            </div>

            <!-- Información de la colección -->
            <div class="card mb-4 shadow-sm">
                <div class="card-body">
                    <h2 class="h5 mb-3">
                        <i class="bi bi-gear"></i> Configurar Algoritmo de Consenso
                    </h2>
                    <p class="text-muted mb-0">
                        Colección: <strong th:text="${coleccion.titulo}">Título de la colección</strong>
                    </p>
                </div>
            </div>

            <!-- Alertas -->
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i>
                <span th:text="${success}">Éxito</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${error}">Error</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Formulario de configuración -->
            <div class="card shadow-sm">
                <div class="card-body">
                    <form th:action="@{/admin/colecciones/{id}/consenso(id=${coleccion.handle})}" method="post">

                        <div class="mb-4">
                            <label for="tipoConsenso" class="form-label fw-bold">
                                Tipo de Algoritmo de Consenso
                            </label>
                            <select class="form-select" name="tipoConsenso" id="tipoConsenso" required>
                                <option value="" th:selected="${coleccion.tipoConsenso == null or coleccion.tipoConsenso == '' or coleccion.tipoConsenso == 'DEFAULT'}">Seleccione un tipo...</option>
                                <option value="ABSOLUTA" th:selected="${coleccion.tipoConsenso == 'ABSOLUTA'}">Absoluta</option>
                                <option value="MAYORIA_SIMPLE" th:selected="${coleccion.tipoConsenso == 'MAYORIA_SIMPLE'}">Mayoría Simple</option>
                                <option value="MULTIPLES_MENCIONES" th:selected="${coleccion.tipoConsenso == 'MULTIPLES_MENCIONES'}">Múltiples Menciones</option>
                            </select>
                            <div class="form-text">
                                Seleccione el algoritmo de consenso que se utilizará para esta colección.
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a class="btn btn-outline-secondary"
                               th:href="@{/colecciones}">
                                Cancelar
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-save"></i> Guardar Configuración
                            </button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </section>

</div>
</html>
