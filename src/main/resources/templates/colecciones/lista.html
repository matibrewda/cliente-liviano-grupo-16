<html th:replace="~{base :: layout(${titulo}, ~{::contenido}, ~{}, ~{})}">
<div th:fragment="contenido" class="row">
    <section class="py-4 bg-light">
        <div class="container">

            <div th:if="${mensaje}" class="alert alert-dismissible fade show"
                 th:classappend="${tipoMensaje == 'success' ? 'alert-success' : (tipoMensaje == 'danger' ? 'alert-danger' : 'alert-info')}" role="alert">
                <i class="bi bi-check-circle-fill" th:if="${tipoMensaje == 'success'}"></i>
                <i class="bi bi-exclamation-triangle-fill" th:if="${tipoMensaje == 'danger'}"></i>
                <span th:text="${mensaje}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="d-flex align-items-center gap-3">
                    <h2 class="h4 mb-0">Listado de colecciones</h2>
                    <span class="badge bg-light text-dark border fs-6 px-3 py-2">
                    Total: <span th:text="${totalColecciones}">0</span>
                    </span>
                </div>

                <a th:href="@{/colecciones/nuevo}" class="btn btn-primary">
                    <i class="bi bi-plus-circle-fill me-1"></i>
                    Agregar Colección
                </a>
            </div>


            <div class="table-responsive shadow-sm bg-white rounded-3">
                <table class="table table-hover mb-0 align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th scope="col">Título</th>
                        <th scope="col">Descripción</th>
                        <th scope="col" class="text-center">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>

                    <tr th:each="c : ${colecciones}">
                        <td th:text="${c.titulo}">Incidentes viales CABA</td>
                        <td th:text="${c.descripcion}">Hechos reportados...</td>
                        <td class="text-center">
                            <div class="btn-group" role="group">
                                <a class="btn btn-sm btn-outline-primary"
                                   th:href="@{|/colecciones/${c.handle}|}">
                                    <i class="bi bi-eye"></i> Ver colección
                                </a>
                                <a class="btn btn-sm btn-outline-primary"
                                   th:href="@{|/colecciones/${c.handle}/hechos|}">
                                    <i class="bi bi-eye"></i> Ver hechos
                                </a>
                                <a class="btn btn-sm btn-outline-secondary"
                                   th:href="@{|/admin/colecciones/${c.handle}|}">
                                    <i class="bi bi-gear"></i> Administrar
                                </a>
                            </div>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(colecciones)}">
                        <td colspan="3" class="text-center text-muted py-4">
                            No hay colecciones disponibles por el momento.
                        </td>
                    </tr>

                    </tbody>
                </table>
            </div>

        </div>
    </section>

</div>
</html>
