<html th:replace="~{base :: layout(${titulo}, ~{::contenido}, ~{}, ~{})}">
<div th:fragment="contenido" class="row">
    <div class="col-12">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 mb-0">
                <i class="fas fa-edit me-2 text-primary"></i>
                <span th:text="${titulo}">Nueva solicitud de modificación</span>
            </h1>
            <a th:href="@{/solicitudes-modificacion}" class="btn btn-secondary">
                <i class="fas fa-arrow-left me-1"></i>
                Volver al listado
            </a>
        </div>

        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="card border-primary">
            <div class="card-header bg-primary text-white">
                <h5 class="card-title mb-0">
                    <i class="fas fa-paper-plane me-2"></i>
                    Datos de la modificación solicitada
                </h5>
            </div>
            <div class="card-body">
                <div class="alert alert-info">
                    <i class="fas fa-info-circle me-1"></i>
                    La solicitud de modificación será revisada por un administrador antes de aplicarse.
                </div>

                <form th:action="@{/solicitudes-modificacion/crear}" method="post">
                    <div th:if="${idHecho != null}" class="mb-3">
                        <input type="hidden" name="idHecho" th:value="${idHecho}"/>
                    </div>
                    <div th:if="${idHecho == null}" class="mb-3">
                        <label for="idHecho" class="form-label">ID del hecho <span class="text-danger">*</span></label>
                        <input type="number" class="form-control" id="idHecho" name="idHecho" min="1" required
                               placeholder="ID del hecho a modificar"/>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="titulo" class="form-label">Título <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="titulo" name="titulo"
                                       th:value="${tituloHecho != null ? tituloHecho : titulo}"
                                       placeholder="Título del hecho" required/>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="categoriaNombre" class="form-label">Categoría <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="categoriaNombre" name="categoriaNombre"
                                       th:value="${categoriaNombre}"
                                       placeholder="Ej: Alud" required/>
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="descripcion" class="form-label">Descripción <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="descripcion" name="descripcion"
                               th:value="${descripcion}"
                               placeholder="Descripción del hecho" required/>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="latitud" class="form-label">Latitud <span class="text-danger">*</span></label>
                                <input type="number" step="any" class="form-control" id="latitud" name="latitud"
                                       th:value="${latitud}"
                                       placeholder="Ej: -34.6037" required/>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="longitud" class="form-label">Longitud <span class="text-danger">*</span></label>
                                <input type="number" step="any" class="form-control" id="longitud" name="longitud"
                                       th:value="${longitud}"
                                       placeholder="Ej: -58.3816" required/>
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="fechaAcontecimiento" class="form-label">Fecha del acontecimiento <span class="text-danger">*</span></label>
                        <input type="date" class="form-control" id="fechaAcontecimiento" name="fechaAcontecimiento"
                               th:value="${fechaAcontecimiento}"
                               required/>
                    </div>

                    <div class="mb-3">
                        <label for="motivo" class="form-label">Motivo de la solicitud <span class="text-danger">*</span></label>
                        <textarea class="form-control" id="motivo" name="motivo" rows="4"
                                  placeholder="Explicá por qué solicitás esta modificación..." required></textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a th:href="@{/solicitudes-modificacion}" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-paper-plane me-1"></i>
                            Enviar solicitud
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</html>
