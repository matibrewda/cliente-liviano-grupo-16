<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa en Vivo - MetaMapa</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <style>
        #miMapa {
            height: 600px;
            width: 100%;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            z-index: 1;
        }
        .popup-titulo { font-weight: bold; color: #0d6efd; margin-bottom: 5px;}
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}"><i class="bi bi-map-fill"></i> MetaMapa</a>
    </div>
</nav>

<div class="container-fluid px-4 mb-5">
    <div class="row">
        <div class="col-12 mb-3">
            <h2 class="fw-bold"><i class="bi bi-globe-americas text-primary"></i> Mapa de Hechos</h2>
            <p class="text-muted">Mostrando datos reales desde la base de datos.</p>
        </div>

        <div class="col-12">
            <div id="miMapa"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function () {
        var map = L.map('miMapa').setView([-34.6037, -58.3816], 12);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);

        // Recibimos la lista simplificada
        var hechosReales = /*[[${listaHechos}]]*/ [];

        console.log("Datos limpios recibidos:", hechosReales);

        if (hechosReales && hechosReales.length > 0) {
            hechosReales.forEach(function(hecho) {
                // Ahora lat y lng vienen directos, porque los extrajimos en el Controller Java
                var marker = L.marker([hecho.lat, hecho.lng]).addTo(map);

                var popupContent = `
                    <div class="popup-titulo">${hecho.titulo}</div>
                    <div class="text-muted small mb-1"><strong>Categoría:</strong> ${hecho.categoria || 'N/A'}</div>
                    <a href="/hechos/${hecho.id}" class="btn btn-sm btn-primary w-100 mt-2">Ver Detalles</a>
                `;
                marker.bindPopup(popupContent);
            });
        }
    });
</script>
</body>
</html>
